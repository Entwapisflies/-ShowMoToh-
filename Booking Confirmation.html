<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmation - Movie & Theater Ticketing Wireframe</title>
    <!-- Tailwind CSS CDN for responsive layout utilities -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ==========================================================================
           BASE & 30% SCALED WIREFRAME SIZING VARIABLES
           Matches Homepage.html & Seat Selection.html dimensions and visual tokens
           ========================================================================== */
        :root {
            --red-backdrop-max-width: 1500px;
            --ticket-max-width: 720px; /* Scaled +30% from standard wireframe ticket */
        }

        body {
            background-color: #120d0d; /* Very dark brown/black outer background */
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Outer Deep Red Container (#7c1919) */
        .red-backdrop {
            background-color: #7c1919;
            max-width: var(--red-backdrop-max-width);
            width: 96%;
        }

        /* Serif Header matching "INITIAL UI WIREFRAME: Booking Confirmation" */
        .wireframe-title {
            font-family: Georgia, 'Times New Roman', Times, serif;
        }

        /* Wireframe Application Window Borders & Top Bar */
        .wf-window-border {
            border: 2.5px solid #111111;
        }

        .wf-topbar-strip {
            background-color: #cbd2d9; /* Light bluish-gray bar */
        }

        /* ==========================================================================
           CENTER VINTAGE THEATER TICKET STYLES (Matches image_d8ff96.png)
           ========================================================================== */
        .ticket-wrapper {
            width: 100%;
            max-width: var(--ticket-max-width);
        }

        .ticket-outer-frame {
            background-color: #8b1e3f; /* Thick maroon/crimson outer frame */
            padding: 15px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
        }

        .ticket-inner-body {
            background-color: #d6c7b2; /* Warm beige/tan inner ticket surface */
            display: flex;
            flex-direction: row;
            align-items: stretch;
            min-height: 330px;
        }

        /* Vertical perforated dotted maroon divider between main ticket and stub */
        .ticket-stub-divider {
            border-left: 3px dotted #8b1e3f;
        }

        /* Gold/Ochre five-pointed stars */
        .ticket-stars {
            color: #9c7a23;
            letter-spacing: 0.65rem;
            font-size: 1.15rem;
            line-height: 1;
            user-select: none;
        }

        /* Thin dark horizontal rule inside ticket */
        .ticket-rule {
            border: 0;
            border-top: 1.5px solid #2b2b2b;
            width: 100%;
        }

        /* Muted label vs bold dark value typography inside ticket */
        .ticket-label {
            color: #6e675f;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .ticket-value {
            color: #1f2421;
            font-size: 1.08rem;
            font-weight: 700;
        }

        /* Save Confirmation Button Below Ticket */
        .save-confirm-btn {
            background-color: #ffffff;
            border: 1.5px solid #7a7a7a;
            border-radius: 10px;
            color: #1f2937;
            transition: background-color 150ms ease, border-color 150ms ease, transform 100ms ease;
        }

        .save-confirm-btn:hover {
            background-color: #f3f4f6;
            border-color: #111111;
        }

        .save-confirm-btn:active {
            transform: translateY(1px);
        }

        /* Responsive adjustments on small mobile screens */
        @media (max-width: 640px) {
            .ticket-inner-body {
                flex-direction: column;
            }
            .ticket-stub-divider {
                border-left: none;
                border-top: 3px dotted #8b1e3f;
            }
        }

        /* Clean print layout when user clicks Save Confirmation */
        @media print {
            body {
                background-color: #ffffff;
            }
            nav, .no-print {
                display: none !important;
            }
            .red-backdrop {
                background-color: transparent !important;
                padding: 0 !important;
                box-shadow: none !important;
            }
            .wireframe-title {
                color: #111111 !important;
                margin-bottom: 16px !important;
            }
        }
    </style>
</head>

                    <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">

            </div>

            <!-- ==================================================================
                 4. WINDOW BODY: CENTERED VINTAGE TICKET & SAVE CONFIRMATION BUTTON
                 ================================================================== -->
            <main class="w-full bg-white py-14 sm:py-20 md:py-24 px-4 sm:px-8 flex flex-col items-center justify-center min-h-[580px]">
                
                <!-- Ticket + Button Container (Matching Width) -->
                <div class="ticket-wrapper flex flex-col items-center">
                    
                    <!-- VINTAGE THEATER TICKET GRAPHIC -->
                    <section aria-label="Booking Confirmation Ticket" class="ticket-outer-frame w-full">
                        <div class="ticket-inner-body">
                            
                            <!-- LEFT MAIN SECTION (~78% Width) -->
                            <div class="w-full sm:w-[78%] px-6 sm:px-10 py-7 flex flex-col justify-between">
                                
                                <!-- Top 5 Gold Stars + Horizontal Line -->
                                <div class="flex flex-col items-center">
                                    <div class="ticket-stars mb-3 pl-2.5" aria-hidden="true">
                                        &#9733;&#9733;&#9733;&#9733;&#9733;
                                    </div>
                                    <hr class="ticket-rule" />
                                </div>

                                <!-- Ticket Details Grid (Show, Showtime, Seats, Name, Ref) -->
                                <div class="grid grid-cols-[100px_1fr] sm:grid-cols-[115px_1fr] gap-y-2.5 items-baseline my-6">
                                    <span class="ticket-label">Show</span>
                                    <span id="ticketShow" class="ticket-value">The Lion in Winter</span>

                                    <span class="ticket-label">Showtime</span>
                                    <span id="ticketShowtime" class="ticket-value">Fri 6:00 PM</span>

                                    <span class="ticket-label">Seats</span>
                                    <span id="ticketSeats" class="ticket-value">B5, B6</span>

                                    <span id="ticketName" class="ticket-value">Kaori</span>

                                    <span class="ticket-label">Ref</span>
                                    <span id="ticketRef" class="ticket-value">TKT-01000</span>
                                </div>

                                <!-- Bottom Horizontal Line + 5 Gold Stars -->
                                <div class="flex flex-col items-center">
                                    <hr class="ticket-rule mb-3" />
                                    <div class="ticket-stars pl-2.5" aria-hidden="true">
                                        &#9733;&#9733;&#9733;&#9733;&#9733;
                                    </div>
                                </div>

                            </div>

                            <!-- RIGHT STUB SECTION (~22% Width) WITH VERTICAL BARCODE -->
                            <div class="w-full sm:w-[22%] ticket-stub-divider px-5 py-6 flex items-center justify-center">

                    <!-- 5. SAVE CONFIRMATION BUTTON BELOW TICKET -->
                    <button 
                        type="button" 
                        id="saveConfirmationBtn"

    <!-- ==========================================================================
         SCRIPT: DOWNLOAD / SAVE CONFIRMATION RECEIPT
         Downloads a clean text confirmation slip and provides visual feedback
         without altering the default wireframe values ("The Lion in Winter", "B5, B6", "Kaori").
         ========================================================================== -->
    <script>
        const saveConfirmationBtn = document.getElementById('saveConfirmationBtn');
        const saveBtnLabel = document.getElementById('saveBtnLabel');

        saveConfirmationBtn.addEventListener('click', () => {
            const show = document.getElementById('ticketShow').textContent;
            const showtime = document.getElementById('ticketShowtime').textContent;
            const seats = document.getElementById('ticketSeats').textContent;
            const name = document.getElementById('ticketName').textContent;
            const ref = document.getElementById('ticketRef').textContent;

            const receiptContent = [
                '============================================',
                '         BOOKING CONFIRMATION TICKET        ',
                '============================================',
                `Show:      ${show}`,
                `Showtime:  ${showtime}`,
                `Seats:     ${seats}`,
                `Name:      ${name}`,
                `Ref:       ${ref}`,
                '============================================'
            ].join('\n');

            // Trigger download of confirmation file
            const blob = new Blob([receiptContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${ref}-Confirmation.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            // Subtle button confirmation feedback
            const originalText = saveBtnLabel.textContent;
            saveBtnLabel.textContent = 'Confirmation Saved!';
            setTimeout(() => {
                saveBtnLabel.textContent = originalText;
            }, 2200);
        });
    </script>
</body>
